<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ларец — каталог украшений</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #efece5;
    --surface: #ffffff;
    --surface-2: #f7f5f0;
    --tray: #1e3a30;
    --tray-2: #24463a;
    --text: #221f1b;
    --text-muted: #6e6759;
    --accent: #a9823e;
    --accent-strong: #8a6a2e;
    --accent-on: #26200f;
    --danger: #a23b2e;
    --danger-strong: #872f24;
    --border: #dcd7cb;
    --focus: #a9823e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15130f;
      --surface: #1e1b16;
      --surface-2: #24211a;
      --tray: #16281f;
      --tray-2: #1d362b;
      --text: #f1ece1;
      --text-muted: #b3a996;
      --accent: #d8b36a;
      --accent-strong: #e8c888;
      --accent-on: #26200f;
      --danger: #e07a5f;
      --danger-strong: #f0947b;
      --border: #34302a;
      --focus: #d8b36a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
  }
  h1, h2, h3, .display {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    text-wrap: balance;
  }
  button, input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  img { max-width: 100%; }

  .app {
    max-width: 1180px;
    margin-inline: auto;
    padding: 28px 20px 56px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
  }
  header.top .display { font-size: clamp(28px, 4vw, 38px); margin: 0; letter-spacing: 0.2px; }
  header.top .tagline { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
  header.top .count { color: var(--text-muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .layout { display: flex; flex-direction: column; gap: 28px; }
  @media (min-width: 900px) {
    .layout { flex-direction: row; align-items: flex-start; }
    .panel { width: 340px; flex: none; position: sticky; top: 20px; }
    .gallery { flex: 1; min-width: 0; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
  }
  .panel h2 { font-size: 19px; margin: 0 0 4px; }
  .panel .hint { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--text-muted); margin-bottom: 7px;
  }
  .field input[type="text"], .field select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px;
  }

  .dropzone {
    border: 1.5px dashed var(--border); border-radius: 14px; background: var(--surface-2);
    padding: 14px; text-align: center; cursor: pointer; position: relative;
    min-height: 140px; display: flex; align-items: center; justify-content: center;
  }
  .dropzone.has-image { padding: 0; border-style: solid; background: var(--tray); overflow: hidden; }
  .dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .dropzone .placeholder { color: var(--text-muted); font-size: 13px; line-height: 1.5; pointer-events: none; }
  .dropzone .placeholder strong { display: block; color: var(--text); font-size: 14px; margin-bottom: 3px; }
  .dropzone img { width: 100%; height: 160px; object-fit: contain; display: block; pointer-events: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 10px; padding: 11px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-on); width: 100%; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
  .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-muted); }
  .btn-danger-icon {
    background: rgba(0,0,0,0.45); color: #fff; border: none; border-radius: 8px;
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .btn-danger-icon:hover:not(:disabled) { background: var(--danger); }

  .status-line { font-size: 13px; margin-top: 10px; min-height: 18px; line-height: 1.4; }
  .status-line.error { color: var(--danger-strong); }
  .status-line.ok { color: var(--accent-strong); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; }
  .chip {
    flex: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); border-radius: 999px; padding: 7px 14px; font-size: 13px;
    font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .chip.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
  .chip .n { opacity: 0.7; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .card .tray {
    aspect-ratio: 1; background: linear-gradient(155deg, var(--tray), var(--tray-2));
    position: relative; display: flex; align-items: center; justify-content: center;
  }
  .card .tray img { width: 78%; height: 78%; object-fit: contain; }
  .card .tray .del { position: absolute; top: 8px; right: 8px; }
  .card .meta { padding: 12px 14px 14px; }
  .card .meta .name { font-size: 15.5px; margin: 0 0 5px; line-height: 1.25; }
  .card .meta .cat {
    display: inline-block; font-size: 11.5px; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
  }

  .empty, .loading-state {
    border: 1px dashed var(--border); border-radius: 16px; padding: 48px 20px;
    text-align: center; color: var(--text-muted); font-size: 14px;
  }
  .empty strong, .loading-state strong {
    display: block; color: var(--text); font-size: 17px; margin-bottom: 6px;
    font-family: "Fraunces", serif; font-weight: 600;
  }

  .banner {
    border-radius: 12px; padding: 12px 16px; font-size: 13.5px; line-height: 1.5;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted);
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--accent); color: var(--accent-on); padding: 10px 18px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.25); z-index: 50;
  }
  .toast[hidden] { display: none; }

  .overlay {
    position: fixed; inset: 0; background: rgba(10, 8, 6, 0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 60;
  }
  .overlay[hidden] { display: none; }
  .dialog {
    background: var(--surface); border-radius: 16px; padding: 22px; max-width: 340px; width: 100%;
    border: 1px solid var(--border);
  }
  .dialog p { margin: 0 0 18px; font-size: 14.5px; line-height: 1.5; }
  .dialog .row { display: flex; gap: 10px; justify-content: flex-end; }

  [hidden] { display: none !important; }
  svg { display: block; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1 class="display">Ларец</h1>
      <div class="tagline">Каталог украшений — фото, название, категория</div>
    </div>
    <div class="count" id="countLabel"></div>
  </header>

  <div class="layout">
    <div class="panel" id="panel">
      <h2>Добавить украшение</h2>
      <p class="hint">Загрузите фото уже без фона (PNG), укажите название и категорию — товар сразу появится в каталоге справа.</p>

      <form id="uploadForm">
        <div class="field">
          <label for="fileInput">Фото</label>
          <div class="dropzone" id="dropzone">
            <input type="file" id="fileInput" accept="image/png,image/webp,image/jpeg,image/gif" />
            <div class="placeholder" id="filePlaceholder">
              <strong>Выберите файл</strong>
              PNG с прозрачным фоном подойдёт лучше всего
            </div>
            <img id="filePreview" hidden alt="Предпросмотр" />
          </div>
        </div>

        <div class="field">
          <label for="nameInput">Название</label>
          <input type="text" id="nameInput" placeholder="Например, «Кольцо Аврора»" maxlength="120" />
        </div>

        <div class="field">
          <label for="categorySelect">Категория</label>
          <select id="categorySelect"></select>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Добавить в каталог</button>
        <div class="status-line" id="formStatus"></div>
      </form>
    </div>

    <div class="gallery">
      <div class="chips" id="chips" hidden></div>
      <div id="galleryBody">
        <div class="loading-state" id="loadingState">
          <strong>Загружаем каталог…</strong>
          Это займёт секунду
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="overlay" id="confirmOverlay" hidden>
  <div class="dialog">
    <p id="confirmMessage"></p>
    <div class="row">
      <button class="btn btn-ghost" id="confirmCancel">Отмена</button>
      <button class="btn btn-primary" style="background:var(--danger); color:#fff; width:auto;" id="confirmYes">Удалить</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var FALLBACK_CATEGORIES = [
    { slug: "rings", label: "Кольца" },
    { slug: "earrings", label: "Серьги" },
    { slug: "bracelets", label: "Браслеты" },
    { slug: "necklaces", label: "Колье и цепочки" },
    { slug: "pendants", label: "Кулоны и подвески" },
    { slug: "brooches", label: "Броши" },
    { slug: "watches", label: "Часы" },
    { slug: "other", label: "Другое" }
  ];

  var CATEGORIES = FALLBACK_CATEGORIES;
  var items = [];
  var activeCategory = "all";
  var previewUrl = null;

  var els = {};
  [
    "panel", "uploadForm", "dropzone", "fileInput", "filePlaceholder", "filePreview",
    "nameInput", "categorySelect", "submitBtn", "formStatus",
    "chips", "galleryBody", "loadingState", "countLabel", "toast",
    "confirmOverlay", "confirmMessage", "confirmCancel", "confirmYes"
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function svgTrash() {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>';
  }

  function categoryLabel(slug) {
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].slug === slug) return CATEGORIES[i].label;
    }
    return slug || "Без категории";
  }

  function populateCategorySelect() {
    els.categorySelect.innerHTML = "";
    CATEGORIES.forEach(function (c) {
      var opt = document.createElement("option");
      opt.value = c.slug;
      opt.textContent = c.label;
      els.categorySelect.appendChild(opt);
    });
  }
  populateCategorySelect();

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.hidden = false;
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(function () { els.toast.hidden = true; }, 2600);
  }

  function confirmDialog(message) {
    return new Promise(function (resolve) {
      els.confirmMessage.textContent = message;
      els.confirmOverlay.hidden = false;
      function cleanup(result) {
        els.confirmOverlay.hidden = true;
        els.confirmYes.removeEventListener("click", onYes);
        els.confirmCancel.removeEventListener("click", onNo);
        resolve(result);
      }
      function onYes() { cleanup(true); }
      function onNo() { cleanup(false); }
      els.confirmYes.addEventListener("click", onYes);
      els.confirmCancel.addEventListener("click", onNo);
    });
  }

  els.fileInput.addEventListener("change", function () {
    var file = els.fileInput.files && els.fileInput.files[0];
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    if (!file) {
      els.dropzone.classList.remove("has-image");
      els.filePlaceholder.hidden = false;
      els.filePreview.hidden = true;
      return;
    }
    previewUrl = URL.createObjectURL(file);
    els.filePreview.src = previewUrl;
    els.filePreview.hidden = false;
    els.filePlaceholder.hidden = true;
    els.dropzone.classList.add("has-image");
  });

  function setFormStatus(text, kind) {
    els.formStatus.textContent = text || "";
    els.formStatus.className = "status-line" + (kind ? " " + kind : "");
  }

  function setSubmitting(is) {
    els.submitBtn.disabled = is;
    els.submitBtn.textContent = is ? "Добавляем…" : "Добавить в каталог";
  }

  function resetForm() {
    els.uploadForm.reset();
    populateCategorySelect();
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    els.dropzone.classList.remove("has-image");
    els.filePlaceholder.hidden = false;
    els.filePreview.hidden = true;
  }

  els.uploadForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var file = els.fileInput.files && els.fileInput.files[0];
    var name = els.nameInput.value.trim();
    var category = els.categorySelect.value;

    if (!file) { setFormStatus("Выберите фото украшения.", "error"); return; }
    if (!name) { setFormStatus("Введите название украшения.", "error"); return; }

    var formData = new FormData();
    formData.append("photo", file);
    formData.append("name", name);
    formData.append("category", category);

    setSubmitting(true);
    setFormStatus("", "");

    fetch("/api/items", { method: "POST", body: formData })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (!result.ok) throw new Error(result.data.error || "Не удалось добавить товар");
        resetForm();
        setFormStatus("Добавлено в каталог.", "ok");
        showToast("Украшение добавлено в каталог");
        loadItems();
      })
      .catch(function (err) {
        setFormStatus(err.message || "Не удалось добавить товар. Попробуйте ещё раз.", "error");
      })
      .finally(function () {
        setSubmitting(false);
      });
  });

  function handleDelete(item) {
    confirmDialog('Удалить «' + item.name + '» из каталога?').then(function (ok) {
      if (!ok) return;
      fetch("/api/items/" + encodeURIComponent(item.id), { method: "DELETE" })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || "Не удалось удалить"); });
          showToast("Удалено из каталога");
          loadItems();
        })
        .catch(function (err) {
          showToast(err.message || "Не удалось удалить товар");
        });
    });
  }

  function updateChips() {
    var counts = {};
    items.forEach(function (it) {
      var c = it.category || "other";
      counts[c] = (counts[c] || 0) + 1;
    });
    var visibleCats = CATEGORIES.filter(function (c) { return counts[c.slug]; });
    if (visibleCats.length === 0) { els.chips.hidden = true; els.chips.innerHTML = ""; return; }

    if (activeCategory !== "all" && !counts[activeCategory]) activeCategory = "all";

    var html = '<button type="button" class="chip' + (activeCategory === "all" ? " active" : "") + '" data-slug="all">Все<span class="n">' + items.length + '</span></button>';
    visibleCats.forEach(function (c) {
      html += '<button type="button" class="chip' + (activeCategory === c.slug ? " active" : "") + '" data-slug="' + c.slug + '">' + escapeHtml(c.label) + '<span class="n">' + counts[c.slug] + '</span></button>';
    });
    els.chips.innerHTML = html;
    els.chips.hidden = false;

    Array.prototype.forEach.call(els.chips.querySelectorAll(".chip"), function (btn) {
      btn.addEventListener("click", function () {
        activeCategory = btn.getAttribute("data-slug");
        renderGallery();
      });
    });
  }

  function pluralize(n) {
    var mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return "украшение";
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "украшения";
    return "украшений";
  }

  function renderGallery() {
    updateChips();
    els.countLabel.textContent = items.length ? items.length + " " + pluralize(items.length) : "";

    var visible = activeCategory === "all" ? items : items.filter(function (it) { return (it.category || "other") === activeCategory; });

    if (items.length === 0) {
      els.galleryBody.innerHTML = '<div class="empty"><strong>В каталоге пока пусто</strong>Добавьте первое украшение через форму слева.</div>';
      return;
    }
    if (visible.length === 0) {
      els.galleryBody.innerHTML = '<div class="empty"><strong>Ничего не найдено</strong>В этой категории пока нет украшений.</div>';
      return;
    }

    var grid = document.createElement("div");
    grid.className = "grid";
    visible.forEach(function (item) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="tray">' +
          '<img src="/uploads/' + encodeURIComponent(item.photo) + '" alt="' + escapeHtml(item.name) + '" loading="lazy" />' +
          '<button type="button" class="btn-danger-icon del" aria-label="Удалить">' + svgTrash() + '</button>' +
        '</div>' +
        '<div class="meta">' +
          '<h3 class="name">' + escapeHtml(item.name) + '</h3>' +
          '<span class="cat">' + escapeHtml(categoryLabel(item.category)) + '</span>' +
        '</div>';
      card.querySelector(".del").addEventListener("click", function () { handleDelete(item); });
      grid.appendChild(card);
    });
    els.galleryBody.innerHTML = "";
    els.galleryBody.appendChild(grid);
  }

  function loadItems() {
    return fetch("/api/items")
      .then(function (res) { if (!res.ok) throw new Error("http " + res.status); return res.json(); })
      .then(function (data) {
        items = data;
        renderGallery();
      })
      .catch(function () {
        els.galleryBody.innerHTML = '<div class="banner">Не удалось загрузить каталог. Проверьте, что сервер запущен, и обновите страницу.</div>';
      });
  }

  function loadCategories() {
    return fetch("/api/categories")
      .then(function (res) { if (!res.ok) throw new Error("http " + res.status); return res.json(); })
      .then(function (data) {
        if (Array.isArray(data) && data.length) {
          CATEGORIES = data;
          populateCategorySelect();
        }
      })
      .catch(function () { /* keep fallback list */ });
  }

  Promise.all([loadCategories(), loadItems()]);
})();
</script>
</body>
</html>
