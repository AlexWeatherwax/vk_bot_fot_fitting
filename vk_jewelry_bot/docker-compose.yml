services:
  bot:
    build: .
    image: vk-jewelry-bot:local
    env_file: .env
    restart: unless-stopped
    volumes:
      # Редактор обновляет файлы на хосте; боту нужен только доступ на чтение.
      - ./bot/jewelry/gallery:/app/bot/jewelry/gallery:ro
      - ./data/models:/app/data/models:ro
      # Согласия должны переживать пересоздание контейнера.
      - ./data/consent:/app/data/consent:rw
      - ./data/sessions:/app/data/sessions:rw
