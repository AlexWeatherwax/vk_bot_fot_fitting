<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор украшений</title><link rel="stylesheet" href="static/style.css"><body><h1>Редактор украшений</h1><main><section><label>Каталог<select id="existing"></select></label><button id="load">Открыть</button><button id="new">Новое</button><button id="refresh">Обновить список</button><label>Название<input id="name" maxlength="160"></label><p id="duplicate"></p><label>Категория<select id="category"></select></label><label>Украшение без фона<input type="file" id="jewelry" accept="image/png,image/webp"></label><label><input type="checkbox" id="crop" checked>Обрезать прозрачные поля при загрузке</label><label>Серьги<select id="earMode"><option value="single">Одна → отразить на второе ухо</option><option value="pair">Пара на картинке</option><option value="mono">Моно-серьга</option></select></label><div id="fields"></div><button id="preview">Предпросмотр</button><hr><label><input type="checkbox" id="confirm">Подтверждаю обновление существующего украшения</label><button id="save">Сохранить</button><p id="status" role="status"></p></section><section><label>Другое фото модели<input type="file" id="photo" accept="image/jpeg,image/png,image/webp"></label><p>Перетащите синюю метку. После отпускания сервер перерисует украшение. Масштаб и поворот — слева.</p><p>По умолчанию — ваше фото уха. Для рук, плеч и макушки загрузите подходящие фото.</p><canvas id="canvas"></canvas><p id="renderStatus" role="status"></p></section></main><script src="static/app.js" defer></script></body></html>
